<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="map-title map-description">
  <title id="map-title">Awesome Exploration research map</title>
  <desc id="map-description">259 curated papers organized into five research categories, with current paper counts and key topics for each category.</desc>
  <defs>
    <linearGradient id="map-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAFBFC" />
      <stop offset="1" stop-color="#F4F7F8" />
    </linearGradient>
    <style>
      text { font-family: "Avenir Next", "Trebuchet MS", sans-serif; }
      .map-heading { fill: #172033; font-size: 23px; font-weight: 500; letter-spacing: 0.7px; }
      .map-subtitle { fill: #667085; font-size: 13px; font-weight: 400; }
      .map-total { fill: #172033; font-size: 34px; font-weight: 500; }
      .map-total-label { fill: #667085; font-size: 11px; font-weight: 500; letter-spacing: 1.3px; }
      .track-index { fill: #FFFFFF; font-size: 10px; font-weight: 500; letter-spacing: 0.6px; }
      .track-title { fill: #172033; font-size: 17px; font-weight: 500; }
      .track-keywords { fill: #7A8495; font-size: 11px; font-weight: 400; }
      .count-chip { fill: #172033; }
      .track-count { fill: #FFFFFF; font-size: 15px; font-weight: 700; }
      .track-share { fill: #475467; font-size: 12px; font-weight: 600; }
      .bar-track { fill: #E5E9EF; }
      .row-line { stroke: #E3E7EC; stroke-width: 1; }
      .footer { fill: #8993A4; font-size: 10px; font-weight: 500; letter-spacing: 1.2px; }
    </style>
  </defs>
  <rect x="5" y="5" width="1190" height="460" rx="24" fill="url(#map-background)" />
  <text x="36" y="48" class="map-heading">Exploration research landscape</text>
  <text x="36" y="73" class="map-subtitle">Five research categories across large language models, agents, training, and evaluation</text>
  <text x="1138" y="48" class="map-total" text-anchor="end">259</text>
  <text x="1138" y="70" class="map-total-label" text-anchor="end">CURATED PAPERS</text>
  <line x1="30" y1="95" x2="1170" y2="95" class="row-line" />
  <g aria-label="Exploration for LLM Generation &amp; Inference: 62 papers, 23.9 percent of the catalog"><circle cx="45" cy="138" r="16" fill="#6E8FB8" /><text x="45" y="143" class="track-index" text-anchor="middle">01</text><text x="76" y="138" class="track-title">Exploration for LLM Generation &amp; Inference</text><text x="76" y="159" class="track-keywords">sampling  |  search  |  diversity</text><rect x="490" y="128" width="540" height="14" rx="7" class="bar-track" /><rect x="490" y="128" width="267.8" height="14" rx="7" fill="#6E8FB8" /><rect x="1038" y="121" width="80" height="30" rx="15" class="count-chip" /><text x="1078" y="141" class="track-count" text-anchor="middle">62</text><text x="1168" y="141" class="track-share" text-anchor="end">23.9%</text><line x1="30" y1="173" x2="1170" y2="173" class="row-line" /></g><g aria-label="Exploration for RLVR, Policy &amp; Curriculum: 125 papers, 48.3 percent of the catalog"><circle cx="45" cy="195" r="16" fill="#B07A68" /><text x="45" y="200" class="track-index" text-anchor="middle">02</text><text x="76" y="195" class="track-title">Exploration for RLVR, Policy &amp; Curriculum</text><text x="76" y="216" class="track-keywords">curriculum  |  reward  |  policy</text><rect x="490" y="185" width="540" height="14" rx="7" class="bar-track" /><rect x="490" y="185" width="540" height="14" rx="7" fill="#B07A68" /><rect x="1038" y="178" width="80" height="30" rx="15" class="count-chip" /><text x="1078" y="198" class="track-count" text-anchor="middle">125</text><text x="1168" y="198" class="track-share" text-anchor="end">48.3%</text><line x1="30" y1="230" x2="1170" y2="230" class="row-line" /></g><g aria-label="Agentic Exploration: 22 papers, 8.5 percent of the catalog"><circle cx="45" cy="252" r="16" fill="#8B80B6" /><text x="45" y="257" class="track-index" text-anchor="middle">03</text><text x="76" y="252" class="track-title">Agentic Exploration</text><text x="76" y="273" class="track-keywords">tools  |  planning  |  memory  |  worlds</text><rect x="490" y="242" width="540" height="14" rx="7" class="bar-track" /><rect x="490" y="242" width="95" height="14" rx="7" fill="#8B80B6" /><rect x="1038" y="235" width="80" height="30" rx="15" class="count-chip" /><text x="1078" y="255" class="track-count" text-anchor="middle">22</text><text x="1168" y="255" class="track-share" text-anchor="end">8.5%</text><line x1="30" y1="287" x2="1170" y2="287" class="row-line" /></g><g aria-label="Agentic Exploration for Training: 20 papers, 7.7 percent of the catalog"><circle cx="45" cy="309" r="16" fill="#5F8F8B" /><text x="45" y="314" class="track-index" text-anchor="middle">04</text><text x="76" y="309" class="track-title">Agentic Exploration for Training</text><text x="76" y="330" class="track-keywords">experience  |  tasks  |  policy updates</text><rect x="490" y="299" width="540" height="14" rx="7" class="bar-track" /><rect x="490" y="299" width="86.4" height="14" rx="7" fill="#5F8F8B" /><rect x="1038" y="292" width="80" height="30" rx="15" class="count-chip" /><text x="1078" y="312" class="track-count" text-anchor="middle">20</text><text x="1168" y="312" class="track-share" text-anchor="end">7.7%</text><line x1="30" y1="344" x2="1170" y2="344" class="row-line" /></g><g aria-label="Understanding, Evaluation &amp; Benchmarks: 30 papers, 11.6 percent of the catalog"><circle cx="45" cy="366" r="16" fill="#B06D73" /><text x="45" y="371" class="track-index" text-anchor="middle">05</text><text x="76" y="366" class="track-title">Understanding, Evaluation &amp; Benchmarks</text><text x="76" y="387" class="track-keywords">theory  |  metrics  |  benchmarks</text><rect x="490" y="356" width="540" height="14" rx="7" class="bar-track" /><rect x="490" y="356" width="129.6" height="14" rx="7" fill="#B06D73" /><rect x="1038" y="349" width="80" height="30" rx="15" class="count-chip" /><text x="1078" y="369" class="track-count" text-anchor="middle">30</text><text x="1168" y="369" class="track-share" text-anchor="end">11.6%</text><line x1="30" y1="401" x2="1170" y2="401" class="row-line" /></g>
  <text x="600" y="450" class="footer" text-anchor="middle">FIVE RESEARCH CATEGORIES  /  COUNTS GENERATED FROM THE CURATED REGISTRY</text>
</svg>
