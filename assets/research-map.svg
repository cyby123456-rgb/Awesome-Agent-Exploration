<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="map-title map-description">
  <title id="map-title">Awesome Exploration research map</title>
  <desc id="map-description">254 curated papers organized into seven research tracks, with current paper counts and key topics for each track.</desc>
  <defs>
    <linearGradient id="map-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAFBFC" />
      <stop offset="1" stop-color="#F4F7F8" />
    </linearGradient>
    <style>
      text { font-family: "Avenir Next", "Trebuchet MS", sans-serif; }
      .map-heading { fill: #172033; font-size: 23px; font-weight: 500; letter-spacing: 0.7px; }
      .map-subtitle { fill: #667085; font-size: 13px; font-weight: 400; }
      .map-total { fill: #172033; font-size: 34px; font-weight: 500; }
      .map-total-label { fill: #667085; font-size: 11px; font-weight: 500; letter-spacing: 1.3px; }
      .track-index { fill: #FFFFFF; font-size: 10px; font-weight: 500; letter-spacing: 0.6px; }
      .track-title { fill: #172033; font-size: 17px; font-weight: 500; }
      .track-keywords { fill: #7A8495; font-size: 11px; font-weight: 400; }
      .track-count { fill: #344054; font-size: 18px; font-weight: 500; }
      .track-share { fill: #7A8495; font-size: 12px; font-weight: 400; }
      .bar-track { fill: #E5E9EF; }
      .row-line { stroke: #E3E7EC; stroke-width: 1; }
      .footer { fill: #8993A4; font-size: 10px; font-weight: 500; letter-spacing: 1.2px; }
    </style>
  </defs>
  <rect x="5" y="5" width="1190" height="560" rx="24" fill="url(#map-background)" />
  <text x="36" y="48" class="map-heading">Exploration research landscape</text>
  <text x="36" y="73" class="map-subtitle">Where exploration happens across language models, RLVR, agents, data, memory, and evaluation</text>
  <text x="1138" y="48" class="map-total" text-anchor="end">254</text>
  <text x="1138" y="70" class="map-total-label" text-anchor="end">CURATED PAPERS</text>
  <line x1="30" y1="95" x2="1170" y2="95" class="row-line" />
  <g aria-label="LLM Generation &amp; Inference Exploration: 55 papers, 21.7 percent of the catalog"><circle cx="45" cy="138" r="16" fill="#6E8FB8" /><text x="45" y="143" class="track-index" text-anchor="middle">01</text><text x="76" y="138" class="track-title">LLM Exploration</text><text x="76" y="159" class="track-keywords">sampling  |  search  |  diversity</text><rect x="430" y="128" width="600" height="14" rx="7" class="bar-track" /><rect x="430" y="128" width="300" height="14" rx="7" fill="#6E8FB8" /><text x="1055" y="141" class="track-count" text-anchor="end">55</text><text x="1138" y="141" class="track-share" text-anchor="end">21.7%</text><line x1="30" y1="173" x2="1170" y2="173" class="row-line" /></g><g aria-label="Policy &amp; RLVR Exploration: 110 papers, 43.3 percent of the catalog"><circle cx="45" cy="195" r="16" fill="#B07A68" /><text x="45" y="200" class="track-index" text-anchor="middle">02</text><text x="76" y="195" class="track-title">Policy &amp; RLVR</text><text x="76" y="216" class="track-keywords">entropy  |  reward  |  optimization</text><rect x="430" y="185" width="600" height="14" rx="7" class="bar-track" /><rect x="430" y="185" width="600" height="14" rx="7" fill="#B07A68" /><text x="1055" y="198" class="track-count" text-anchor="end">110</text><text x="1138" y="198" class="track-share" text-anchor="end">43.3%</text><line x1="30" y1="230" x2="1170" y2="230" class="row-line" /></g><g aria-label="Data, Task &amp; Curriculum Exploration: 10 papers, 3.9 percent of the catalog"><circle cx="45" cy="252" r="16" fill="#5F8F8B" /><text x="45" y="257" class="track-index" text-anchor="middle">03</text><text x="76" y="252" class="track-title">Data, Task &amp; Curriculum</text><text x="76" y="273" class="track-keywords">selection  |  synthesis  |  difficulty</text><rect x="430" y="242" width="600" height="14" rx="7" class="bar-track" /><rect x="430" y="242" width="54.5" height="14" rx="7" fill="#5F8F8B" /><text x="1055" y="255" class="track-count" text-anchor="end">10</text><text x="1138" y="255" class="track-share" text-anchor="end">3.9%</text><line x1="30" y1="287" x2="1170" y2="287" class="row-line" /></g><g aria-label="Agentic &amp; Environment Exploration: 22 papers, 8.7 percent of the catalog"><circle cx="45" cy="309" r="16" fill="#8B80B6" /><text x="45" y="314" class="track-index" text-anchor="middle">04</text><text x="76" y="309" class="track-title">Agentic &amp; Environment</text><text x="76" y="330" class="track-keywords">tools  |  planning  |  embodied worlds</text><rect x="430" y="299" width="600" height="14" rx="7" class="bar-track" /><rect x="430" y="299" width="120" height="14" rx="7" fill="#8B80B6" /><text x="1055" y="312" class="track-count" text-anchor="end">22</text><text x="1138" y="312" class="track-share" text-anchor="end">8.7%</text><line x1="30" y1="344" x2="1170" y2="344" class="row-line" /></g><g aria-label="Self-Improvement &amp; Population Exploration: 12 papers, 4.7 percent of the catalog"><circle cx="45" cy="366" r="16" fill="#A07593" /><text x="45" y="371" class="track-index" text-anchor="middle">05</text><text x="76" y="366" class="track-title">Self-Improvement &amp; Population</text><text x="76" y="387" class="track-keywords">self-play  |  ensembles  |  iteration</text><rect x="430" y="356" width="600" height="14" rx="7" class="bar-track" /><rect x="430" y="356" width="65.5" height="14" rx="7" fill="#A07593" /><text x="1055" y="369" class="track-count" text-anchor="end">12</text><text x="1138" y="369" class="track-share" text-anchor="end">4.7%</text><line x1="30" y1="401" x2="1170" y2="401" class="row-line" /></g><g aria-label="Memory &amp; Knowledge Exploration: 15 papers, 5.9 percent of the catalog"><circle cx="45" cy="423" r="16" fill="#718B75" /><text x="45" y="428" class="track-index" text-anchor="middle">06</text><text x="76" y="423" class="track-title">Memory &amp; Knowledge</text><text x="76" y="444" class="track-keywords">retrieval  |  replay  |  knowledge graphs</text><rect x="430" y="413" width="600" height="14" rx="7" class="bar-track" /><rect x="430" y="413" width="81.8" height="14" rx="7" fill="#718B75" /><text x="1055" y="426" class="track-count" text-anchor="end">15</text><text x="1138" y="426" class="track-share" text-anchor="end">5.9%</text><line x1="30" y1="458" x2="1170" y2="458" class="row-line" /></g><g aria-label="Understanding, Evaluation &amp; Benchmarks: 30 papers, 11.8 percent of the catalog"><circle cx="45" cy="480" r="16" fill="#B06D73" /><text x="45" y="485" class="track-index" text-anchor="middle">07</text><text x="76" y="480" class="track-title">Understanding &amp; Evaluation</text><text x="76" y="501" class="track-keywords">theory  |  metrics  |  benchmarks</text><rect x="430" y="470" width="600" height="14" rx="7" class="bar-track" /><rect x="430" y="470" width="163.6" height="14" rx="7" fill="#B06D73" /><text x="1055" y="483" class="track-count" text-anchor="end">30</text><text x="1138" y="483" class="track-share" text-anchor="end">11.8%</text><line x1="30" y1="515" x2="1170" y2="515" class="row-line" /></g>
  <text x="600" y="550" class="footer" text-anchor="middle">SEVEN COMPLEMENTARY RESEARCH TRACKS  /  COUNTS GENERATED FROM THE CURATED REGISTRY</text>
</svg>
