<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="map-title map-description">
  <title id="map-title">Awesome Exploration research map</title>
  <desc id="map-description">268 curated papers organized into four primary research contexts, with current paper counts and key topics for each context.</desc>
  <defs>
    <linearGradient id="map-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAFBFC" />
      <stop offset="1" stop-color="#F4F7F8" />
    </linearGradient>
    <style>
      text { font-family: "Avenir Next", "Trebuchet MS", sans-serif; }
      .map-heading { fill: #172033; font-size: 23px; font-weight: 500; letter-spacing: 0.7px; }
      .map-subtitle { fill: #667085; font-size: 13px; font-weight: 400; }
      .map-total { fill: #172033; font-size: 34px; font-weight: 500; }
      .map-total-label { fill: #667085; font-size: 11px; font-weight: 500; letter-spacing: 1.3px; }
      .track-index { fill: #FFFFFF; font-size: 10px; font-weight: 500; letter-spacing: 0.6px; }
      .track-title { fill: #172033; font-size: 17px; font-weight: 500; }
      .track-keywords { fill: #7A8495; font-size: 11px; font-weight: 400; }
      .track-count { fill: #344054; font-size: 18px; font-weight: 500; }
      .track-share { fill: #7A8495; font-size: 12px; font-weight: 400; }
      .bar-track { fill: #E5E9EF; }
      .row-line { stroke: #E3E7EC; stroke-width: 1; }
      .footer { fill: #8993A4; font-size: 10px; font-weight: 500; letter-spacing: 1.2px; }
    </style>
  </defs>
  <rect x="5" y="5" width="1190" height="390" rx="24" fill="url(#map-background)" />
  <text x="36" y="48" class="map-heading">Exploration research landscape</text>
  <text x="36" y="73" class="map-subtitle">Four primary contexts; data, memory, population, and self-improvement remain orthogonal lenses</text>
  <text x="1138" y="48" class="map-total" text-anchor="end">268</text>
  <text x="1138" y="70" class="map-total-label" text-anchor="end">CURATED PAPERS</text>
  <line x1="30" y1="95" x2="1170" y2="95" class="row-line" />
  <g aria-label="LLM Generation &amp; Inference Exploration: 62 papers, 23.1 percent of the catalog"><circle cx="45" cy="138" r="16" fill="#6E8FB8" /><text x="45" y="143" class="track-index" text-anchor="middle">01</text><text x="76" y="138" class="track-title">LLM Exploration</text><text x="76" y="159" class="track-keywords">sampling  |  search  |  diversity</text><rect x="430" y="128" width="600" height="14" rx="7" class="bar-track" /><rect x="430" y="128" width="286.2" height="14" rx="7" fill="#6E8FB8" /><text x="1055" y="141" class="track-count" text-anchor="end">62</text><text x="1138" y="141" class="track-share" text-anchor="end">23.1%</text><line x1="30" y1="173" x2="1170" y2="173" class="row-line" /></g><g aria-label="Training, Policy &amp; Curriculum Exploration: 130 papers, 48.5 percent of the catalog"><circle cx="45" cy="195" r="16" fill="#B07A68" /><text x="45" y="200" class="track-index" text-anchor="middle">02</text><text x="76" y="195" class="track-title">Training, Policy &amp; Curriculum</text><text x="76" y="216" class="track-keywords">data  |  curriculum  |  reward  |  policy</text><rect x="430" y="185" width="600" height="14" rx="7" class="bar-track" /><rect x="430" y="185" width="600" height="14" rx="7" fill="#B07A68" /><text x="1055" y="198" class="track-count" text-anchor="end">130</text><text x="1138" y="198" class="track-share" text-anchor="end">48.5%</text><line x1="30" y1="230" x2="1170" y2="230" class="row-line" /></g><g aria-label="Agentic &amp; Environment Exploration: 46 papers, 17.2 percent of the catalog"><circle cx="45" cy="252" r="16" fill="#8B80B6" /><text x="45" y="257" class="track-index" text-anchor="middle">03</text><text x="76" y="252" class="track-title">Agentic &amp; Environment</text><text x="76" y="273" class="track-keywords">tools  |  planning  |  memory  |  worlds</text><rect x="430" y="242" width="600" height="14" rx="7" class="bar-track" /><rect x="430" y="242" width="212.3" height="14" rx="7" fill="#8B80B6" /><text x="1055" y="255" class="track-count" text-anchor="end">46</text><text x="1138" y="255" class="track-share" text-anchor="end">17.2%</text><line x1="30" y1="287" x2="1170" y2="287" class="row-line" /></g><g aria-label="Understanding, Evaluation &amp; Benchmarks: 30 papers, 11.2 percent of the catalog"><circle cx="45" cy="309" r="16" fill="#B06D73" /><text x="45" y="314" class="track-index" text-anchor="middle">04</text><text x="76" y="309" class="track-title">Understanding &amp; Evaluation</text><text x="76" y="330" class="track-keywords">theory  |  metrics  |  benchmarks</text><rect x="430" y="299" width="600" height="14" rx="7" class="bar-track" /><rect x="430" y="299" width="138.5" height="14" rx="7" fill="#B06D73" /><text x="1055" y="312" class="track-count" text-anchor="end">30</text><text x="1138" y="312" class="track-share" text-anchor="end">11.2%</text><line x1="30" y1="344" x2="1170" y2="344" class="row-line" /></g>
  <text x="600" y="380" class="footer" text-anchor="middle">FOUR PRIMARY RESEARCH CONTEXTS  /  COUNTS GENERATED FROM THE CURATED REGISTRY</text>
</svg>
